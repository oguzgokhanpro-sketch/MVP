services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mvp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mvp"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # Local development only: if AUTH_SECRET is empty/unset in .env, fall back to a PUBLIC,
      # insecure dev secret. The app refuses it on an https deployment; set a real
      # secret (openssl rand -base64 32) for anything other than local use.
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-insecure-secret-change-me-0123456789}
      # Inside the Docker network the database host is the service name.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mvp?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  # Dev tooling (seed, ad-hoc prisma commands): docker compose --profile tools run --rm tools npm run db:seed
  tools:
    profiles: ["tools"]
    build:
      context: .
      target: builder
    env_file: .env
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-insecure-secret-change-me-0123456789}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mvp?schema=public
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
